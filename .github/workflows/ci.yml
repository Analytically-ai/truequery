name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the engine with test extras
        run: python -m pip install -e "plugin/engine[test]"
      - name: Lint
        if: matrix.os == 'ubuntu-latest'
        run: |
          python -m pip install ruff==0.6.9
          ruff check --select F,E9 --exclude std_registry.py plugin/engine/src tools tests
      - name: Generated files are fresh
        if: matrix.os == 'ubuntu-latest'
        run: |
          python tools/generate_registry.py
          python tools/generate_skill.py
          git diff --exit-code
      - name: Tests
        run: python -m pytest -q
      - name: The wheel ships the standard and the licenses
        if: matrix.os == 'ubuntu-latest'
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist plugin/engine
          python - <<'PY'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          assert sum(n.endswith(".yaml") for n in names) == 220, "standard missing"
          assert any(n.endswith("registry_impl.json") for n in names)
          assert any(n.endswith("licenses/LICENSE") for n in names)
          PY
      - name: The sample bad and good SQL give the right exit codes
        shell: bash
        run: |
          set +e
          truequery detect samples/bad_orders.sql
          test $? -eq 1
          truequery detect samples/good_orders.sql
          test $? -eq 0
      - name: The plugin's launcher and hook run its own engine
        shell: bash
        run: |
          python -m pip install uv
          sh plugin/bin/truequery --version | tr -d '\r' | grep -x "truequery $(python -c 'import truequery; print(truequery.__version__)')"
          mkdir -p "$RUNNER_TEMP/proj" && printf 'DELETE FROM t;\n' > "$RUNNER_TEMP/proj/q.sql"
          cd "$RUNNER_TEMP/proj"
          printf '{"hook_event_name":"PostToolUse","tool_name":"Write","tool_input":{"file_path":"q.sql"}}' \
            | CLAUDE_PLUGIN_ROOT="$GITHUB_WORKSPACE/plugin" sh "$GITHUB_WORKSPACE/plugin/scripts/tq-hook.sh" \
            | tee hook.out
          grep -q "sql/unguarded-update-delete" hook.out
      - name: The Windows launcher runs from cmd and PowerShell
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          python -m pip install uv
          $expected = "truequery $((python -c 'import truequery; print(truequery.__version__)').Trim())"
          $v = (cmd /c "plugin\bin\truequery.cmd --version").Trim()
          if ($v -ne $expected) { throw "cmd launcher printed: $v (want $expected)" }
          $env:PATH = "$PWD\plugin\bin;$env:PATH"
          $v = (truequery --version).Trim()
          if ($v -ne $expected) { throw "PowerShell launcher printed: $v (want $expected)" }
