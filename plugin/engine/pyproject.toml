[build-system]
# hatchling builds out of tree: running the engine straight from an
# installed plugin (uv run --with-editable <plugin>/engine) writes nothing
# into it; the plugin's scripts send bytecode to ~/.cache/truequery.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "truequery"
version = "0.1.7"
description = "TrueQuery engine: offline, deterministic checks for SQL and pandas code that silently return the wrong answer"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["sqlglot==30.22.0", "pyyaml==6.0.3"]

authors = [{ name = "Analytically.ai" }]
keywords = ["sql", "analytics", "data-engineering", "lint", "dbt"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Database",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/Analytically-ai/truequery"
Issues = "https://github.com/Analytically-ai/truequery/issues"

[project.optional-dependencies]
# The data reader for `truequery verify` (data files and .duckdb
# databases). 1.2.0 is the first DuckDB with every lockdown setting the
# runner uses (`allowed_paths`); tests/test_assertions_and_safety.py fails
# on 1.1.3. `truequery setup data` installs it; SQLite needs nothing extra.
data = ["duckdb>=1.2.0"]
# pandas and numpy run the pandas proofs in the tests (pinned: the
# versions the proofs were checked against). Never a runtime dependency.
# pyarrow runs the Parquet half of `truequery scaffold`'s generated tests
# (pandas writes and reads Parquet with it); without it they're skipped.
test = ["duckdb>=1.2.0", "pytest", "pandas==3.1.0", "numpy==2.4.6", "jsonschema",
        "pyarrow==26.0.1"]

[project.scripts]
truequery = "truequery.cli:main"
tq = "truequery.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/truequery"]
exclude = ["**/__pycache__"]
