id: sql/fanout-join-pre-aggregation
title: Aggregates over a many-side join pre-aggregate before joining
domain: sql
modes: [build, change, assure, explore]
applies_to: [any]
statement: >
  When a query joins a fact table to a table that holds multiple rows per
  join key and then aggregates a fact-side column, the many side is
  aggregated to the join grain in a CTE first, unless the join key is
  declared unique on the many side.
rationale: >
  Each fact row is duplicated once per matching many-side row, so SUM and
  COUNT silently inflate. This is the most common silent-corruption shape in
  analytics SQL, and reviewers miss it easily because the query reads
  correctly.
failure_example: >
  SUM(orders.amount) grouped after joining order_items on order_id counts
  every order once per line item; reported revenue doubles with no error.
enforcement: contract
contract_required: false
detection_sketch: >
  Detector flags the structural shape: a JOIN feeding an aggregate over the
  other side's column in the same query block with no pre-aggregation CTE.
  Confirmation needs declared facts (primary/unique key on the join key),
  hence contract. False positives: genuine one-to-many enrichments where the
  aggregate is over the many side itself.
severity_suggestion: warning
examples:
  bad: SELECT SUM(o.amount) FROM orders o JOIN items i ON i.order_id = o.order_id;
  good: WITH i AS (SELECT order_id, SUM(qty) AS q FROM items GROUP BY order_id) SELECT SUM(o.amount) FROM orders o JOIN i ON i.order_id = o.order_id;
sources:
- title: Joins Between Tables (PostgreSQL tutorial)
  url: https://www.postgresql.org/docs/current/tutorial-join.html
  publisher: PostgreSQL Global Development Group
  accessed: 2026-10-11
  supports: Join semantics pair each left row with every matching right row, which is the mechanism behind fanout duplication.
- title: Aggregate Functions (DuckDB documentation)
  url: https://duckdb.org/docs/current/sql/functions/aggregates
  publisher: DuckDB
  accessed: 2026-10-11
  supports: Aggregates compute over the grouped input rows, so duplicated input rows inflate the result.
- title: Optimize query computation (BigQuery)
  url: https://docs.cloud.google.com/bigquery/docs/best-practices-performance-compute
  publisher: Google Cloud
  accessed: 2026-10-11
  supports: Shows pre-aggregating the many side in a CTE (comments per user) before the JOIN as the recommended shape.
confidence: high
conflicts_with: []
status: draft
see_also: [consume/explore-join-row-count-checks, sql/distinct-dedup-bandaid]
proof:
  setup: |
    CREATE TABLE o2(order_id INT, amount INT);
    INSERT INTO o2 VALUES (1, 100), (2, 200);
    CREATE TABLE it(order_id INT, qty INT);
    INSERT INTO it VALUES (1, 2), (1, 3), (2, 5);
  bad: "SELECT SUM(o2.amount) FROM o2 JOIN it ON it.order_id = o2.order_id"
  bad_result: "[(400,)]"
  good: "WITH i AS (SELECT order_id, SUM(qty) AS q FROM it GROUP BY order_id) SELECT SUM(o2.amount) FROM o2 JOIN i ON i.order_id = o2.order_id"
  good_result: "[(300,)]"
  note: >
    Order 1 has two item rows, so its amount (100) is counted twice and total
    revenue reads 400 instead of 300. Standard join semantics; the same in
    Postgres, BigQuery, Snowflake and SQL Server.
