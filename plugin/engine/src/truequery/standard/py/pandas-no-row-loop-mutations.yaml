id: py/pandas-no-row-loop-mutations
title: Never write to the row of an iterrows() loop
domain: py
modes: [build, change]
applies_to: [any]
statement: >
  Code that changes a DataFrame inside a `for i, row in df.iterrows()` loop
  writes through the DataFrame (df.loc[i, "col"] = v), or computes the column
  without a loop. Assigning to the loop's row (row["col"] = v, row.col = v)
  is forbidden unless the row itself is then used (collected, returned,
  passed on).
rationale: >
  iterrows() yields each row as a new Series built for the loop. With
  Copy-on-Write (the default since pandas 3.0) it is always a copy: writing
  to it changes that copy, which is thrown away at the next iteration.
  Before pandas 3 the write reached the frame only when every column shared
  one dtype, so the same loop silently did nothing on mixed-type data. The
  loop runs, nothing fails, and the column the code meant to fill keeps its
  old values.
failure_example: >
  A pricing job sets row["total"] = row["qty"] * row["price"] for every
  order inside an iterrows() loop; every total stays 0 and the revenue report
  shows no sales for the day.
enforcement: detector
detection_sketch: >
  Flag an assignment to the second loop variable of a for loop over
  .iterrows() (row[...] = v, row.x = v, row.at[...] = v), when the loop body
  never uses the row as a whole (passes it to a call, stores, returns or
  yields it, calls a method on it) and never rebinds it. itertuples() rows
  are namedtuples: writing to one raises, so it isn't silent and isn't
  flagged.
severity_suggestion: error
examples:
  bad: |
    for i, row in df.iterrows():
        row["total"] = row["qty"] * row["price"]  # changes a copy
  good: |
    df["total"] = df["qty"] * df["price"]
sources:
  - title: "pandas.DataFrame.iterrows | pandas docs"
    url: https://pandas.pydata.org/docs/reference/api/pandas.DataFrame.iterrows.html
    publisher: pandas
    accessed: 2026-11-03
    supports: You should never modify something you are iterating over; this
      is not guaranteed to work in all cases. Depending on the data types,
      the iterator returns a copy and not a view, and writing to it will have
      no effect.
confidence: high
conflicts_with: []
status: draft
proof:
  engine: pandas
  setup: |
    df = pd.DataFrame({"qty": [1, 2], "price": [10, 20], "total": [0, 0]})
  bad: |
    for i, row in df.iterrows():
        row["total"] = row["qty"] * row["price"]
    result = df
  bad_result: "[(1, 10, 0), (2, 20, 0)]"
  good: |
    df["total"] = df["qty"] * df["price"]
    result = df
  good_result: "[(1, 10, 10), (2, 20, 40)]"
