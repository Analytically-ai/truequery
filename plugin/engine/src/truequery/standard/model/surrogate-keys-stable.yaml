id: model/surrogate-keys-stable
title: Surrogate keys are deterministic hashes of natural keys
domain: model
modes: [build, assure]
applies_to: [any]
statement: >
  Surrogate keys in dimensions and merge keys must be computed as
  deterministic hashes of the natural key (e.g. md5 of the key columns), not
  as row numbers, sequences, or random values that change between runs.
rationale: >
  Positional keys shift on every rebuild, breaking merge matching, SCD2
  continuity, and fact-to-dimension joins after any full refresh. Hashed keys
  survive rebuilds and integrate disparate sources on the same natural key.
failure_example: >
  A dimension keyed by ROW_NUMBER rebuilds overnight; every fact row now
  points at the wrong customer and history is scrambled beyond repair.
enforcement: detector
detection_sketch: >
  Scan key-generation expressions for row_number, sequences, or random calls
  in key positions; accept hash-of-natural-key patterns. Flag the rest. False
  positives: fact-table technical keys documented as query-only (per Kimball,
  fact surrogate keys have narrow physical uses).
severity_suggestion: error
examples:
  bad: |
    SELECT ROW_NUMBER() OVER (ORDER BY email) AS customer_key, email FROM stg;
  good: |
    SELECT MD5(LOWER(TRIM(email))) AS customer_key, email FROM stg;
sources:
  - title: Design Tip 81 Fact Table Surrogate Key
    url: https://www.kimballgroup.com/2006/07/design-tip-81-fact-table-surrogate-key/
    publisher: Kimball Group
    accessed: 2026-10-12
    supports: surrogate keys as stable dimension identifiers and their narrow fact-table role
confidence: high
conflicts_with: []
status: draft
