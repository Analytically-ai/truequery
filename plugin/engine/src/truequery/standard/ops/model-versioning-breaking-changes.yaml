  url: https://docs.getdbt.com/docs/mesh/govern/model-versions
  publisher: dbt Labs
  accessed: 2026-10-12
  supports: Versioned models let authors release breaking changes while consumers pin a prior version and migrate on their own schedule; old versions remain available until removed.
- title: SQLMesh documentation
  url: https://sqlmesh.readthedocs.io/en/stable/
  publisher: Tobiko Data
  accessed: 2026-10-12
  supports: Plan/apply impact analysis and a breaking vs non-breaking change workflow for model changes.
- title: Add Exposures to your DAG
  url: https://docs.getdbt.com/docs/build/exposures
  publisher: dbt Labs
  accessed: 2026-10-12
  supports: Exposures register the downstream consumers affected by definition changes.
confidence: high
conflicts_with: []
see_also: [ops/breaking-change-categorization, gov/exposures-registered, model/dbt-contract-enforced]
