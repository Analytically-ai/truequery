id: ops/prod-credentials-isolation
title: Credentials never appear in code, configs, logs, or chat output
domain: ops
modes: [build, change, assure]
applies_to: [any]
statement: >
  Passwords, tokens, private keys, and connection strings with embedded
  credentials must not appear in committed files (DAG files, asset modules,
  hook/adapter code, notebooks promoted to jobs, profiles.yml and other
  configs), CI logs, or pasted debugging output. Code references credentials
  by name, and the values come from the orchestrator's connection/secret
  store (Airflow Connections or a secrets backend; Dagster EnvVar-backed
  resources), environment-injected config, or a secret manager. Production
  credentials live only in the production secret store and deployment
  system, never in developer configs.
rationale: >
  A committed secret spreads to every clone, fork, mirror and log archive and
  stays in git history after the line is deleted, so it must be revoked and
  rotated, often across several environments. Airflow's best practices say
  tasks should not store passwords or tokens and should use Connections;
  Dagster recommends environment variables so secrets are not visible in
  code or the UI; OWASP requires immediate revocation of exposed secrets,
  including those found in code or logs. Isolating production credentials
  means a compromised laptop or log archive still cannot reach production
  data.
failure_example: >
  A hook module embeds SNOWFLAKE_PASSWORD="Winter2024!", and a developer
  pastes a prod connection string into a CI debug log. The repository is
  mirrored to a vendor for review; the credential has to be rotated across
  prod, staging and three BI tools over a weekend, and the CI log stays
  readable by every contractor with repo access.
enforcement: detector
detection_sketch: >
  Scan committed files (all paths, plus git history on first adoption) and
  sample configs for: string literals assigned to or passed as secret-like
  names (password, passwd, token, secret, api_key, private_key,
  client_secret) that are not references (Variable.get, os.environ,
  EnvVar, {{ env_var() }}); high-entropy literals (e.g. Shannon entropy
  above ~4.0 bits/char over 20+ chars) near those names; URIs with embedded
  user:password@ credentials; PEM blocks ("-----BEGIN ... PRIVATE KEY-----");
  provider token formats. Also check that log-redaction/masking is
  configured for CI. Prefer integrating an existing scanner (GitHub secret
  scanning, detect-secrets) over reimplementing patterns. False positives:
  placeholders ("CHANGEME", "<password>"), redacted templates, and clearly
  marked test fixtures excluded from packaging (allowlist by path/marker).
severity_suggestion: error
examples:
  bad: |
    conn = snowflake.connector.connect(account="acme", user="etl", password="Winter2024!")
    # or profiles.yml with the prod password committed to the repo
  good: |
    hook = SnowflakeHook(snowflake_conn_id="prod_dw")  # value lives in the secrets backend
    # Dagster: SnowflakeResource(password=dg.EnvVar("SNOWFLAKE_PASSWORD"))
    # dbt: password: "{{ env_var('DBT_ENV_SECRET_PASSWORD') }}"
sources:
- title: Best Practices (Airflow 3.3.2 documentation)
  url: https://airflow.apache.org/docs/apache-airflow/stable/best-practices.html
  publisher: Apache Software Foundation
  accessed: '2026-10-11'
  supports: Tasks should not store authentication parameters such as passwords or tokens; use Connections,
    retrieved by connection id, and a Secrets Backend for sensitive Variables; mock them in tests via
    AIRFLOW_CONN_/AIRFLOW_VAR_ environment variables.
- title: Secrets Backend (Airflow 3.3.2 documentation)
  url: https://airflow.apache.org/docs/apache-airflow/stable/security/secrets/secrets-backend/index.html
  publisher: Apache Software Foundation
  accessed: '2026-10-11'
  supports: Connections and Variables can be resolved from an alternative secrets backend, searched before
    environment variables and the metastore.
- title: Using environment variables and secrets (Dagster docs)
  url: https://dagster.io/docs/guides/operate/configuration/using-environment-variables-and-secrets
  publisher: Dagster Labs
  accessed: '2026-10-11'
  supports: Hard-coding credentials is bad practice; environment variables keep secrets out of code; EnvVar
    reads at runtime and hides values in the UI; .env files should not be committed.
- title: env_var (dbt docs)
  url: https://docs.getdbt.com/reference/dbt-jinja-functions/env_var
  publisher: dbt Labs
  accessed: '2026-10-11'
  supports: Use env_var in profiles.yml to avoid putting credentials on a server; DBT_ENV_SECRET-prefixed
    variables are restricted to profiles.yml/packages.yml and scrubbed from dbt logs.
- title: Secrets Management Cheat Sheet
  url: https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
  publisher: OWASP
  accessed: '2026-10-11'
  supports: Recommends pre-commit secrets detection, never logging secrets (mask them), and immediate
    revocation and removal of exposed secrets, including those found in code or logs.
- title: About secret scanning (GitHub Docs)
  url: https://docs.github.com/en/code-security/secret-scanning/introduction/about-secret-scanning
  publisher: GitHub
  accessed: '2026-10-11'
  supports: Secret scanning covers the entire git history on all branches; private keys, connection strings
    and generic API keys are detected only via optional non-provider patterns. The entropy threshold in the
    detection sketch is our heuristic, not from this source.
confidence: high
conflicts_with: []
status: draft
