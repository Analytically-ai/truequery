  url: https://www.postgresql.org/docs/current/sql-grant.html
  publisher: PostgreSQL Global Development Group
  accessed: 2026-10-12
  supports: GRANT syntax enumerates per-privilege grants on tables, schemas, and other objects
- title: Privileges (PostgreSQL documentation)
  url: https://www.postgresql.org/docs/current/ddl-priv.html
  publisher: PostgreSQL Global Development Group
  accessed: 2026-10-12
  supports: Objects default to owner-only access; distinct privilege kinds (SELECT vs INSERT/UPDATE/DELETE) map to job duties and need explicit grants
- title: Role Membership (PostgreSQL documentation)
  url: https://www.postgresql.org/docs/current/role-membership.html
  publisher: PostgreSQL Global Development Group
  accessed: 2026-10-12
  supports: Grouping users into roles so privileges are managed per job function
- title: Continuous integration jobs in dbt
  url: https://docs.getdbt.com/docs/deploy/ci-jobs
  publisher: dbt Labs
  accessed: 2026-10-12
  supports: CI jobs build into isolated schemas, which separate, scoped credentials per environment support.
confidence: high
conflicts_with: []
see_also: [gov/no-public-privileges, gov/no-bypassrls-roles]
